services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie-app
    restart: always
    #ports:
    #  - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ./data:/app/data/
    networks:
      - internal       # DB-Verbindung
      - proxy_network  # Nginx-Verbindung
    environment:
      # Backend Config
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      BASE_URL: https://mealie.dnic42.de

      # Database Connection
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_SERVER: mealie_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie

      # SMTP Settings
      SMTP_HOST: "mxe9ef.netcup.net"
      SMTP_PORT: 465
      SMTP_FROM_NAME: Mealie
      SMTP_AUTH_STRATEGY: "SSL"
      SMTP_FROM_EMAIL: "mealie@dnic42.de"
      SMTP_USER: "info@dnic42.de"
      # Ich habe dein Passwort hier und beim OpenAI Key entfernt (Sicherheits-Praxis).
      # Trage deine existierenden Werte wieder ein.
      SMTP_PASSWORD: "mH6e9q01#555?d" 

      # AI Config (Gemini)
      #OPENAI_API_KEY: 
      #OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      #OPENAI_MODEL: gemini-3-flash-preview

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: mealie_db
    image: postgres:15
    restart: always
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:      # <--- NEU
      - internal   # <--- NEU
    environment:
      POSTGRES_PASSWORD: mealie
      POSTGRES_USER: mealie
      PGUSER: mealie
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mealie"]
      interval: 10s
      timeout: 5s
      retries: 5

# --- NEU: Netzwerk Definition ---
networks:
  internal:
    driver: bridge
  proxy_network:
    external: true
